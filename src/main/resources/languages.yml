    abilityDescription: Descrição de habilidade
    abilityDescription_digging: Adiciona temporariamente 5 níveis de eficiência à sua pá. Ativado clicando com o botão direito em uma pá e quebrando um bloco.
    abilityDescription_woodcutting: Faz com que os eixos quebrem temporariamente uma árvore inteira com uma quebra de bloco. Ativado clicando com o botão direito em um machado e quebrando um tronco.
    abilityDescription_mining: Adiciona temporariamente 5 níveis de eficiência à sua picareta. Ativado clicando com o botão direito em uma picareta e depois quebrando o bloco.
    abilityDescription_farming: Faz safras temporariamente quebradas com uma enxada e replanta automaticamente. Ativado ao clicar com o botão direito do mouse em uma enxada e quebrar uma colheita.
    abilityDescription_fishing: Faz com que as varas de pesca capturem um peixe temporariamente. Ativado ao clicar com o botão esquerdo em uma vara de pescar e pescar na água.
    abilityDescription_beastMastery: Temporariamente dá ao seu cavalo um buff de velocidade. Ativado ao clicar com o botão direito do mouse em um cavalo e depois clicar com o botão esquerdo.
    abilityDescription_swordsmanship: Remove temporariamente o cooldown oscilante em espadas. Ativado ao clicar com o botão direito do mouse em uma espada e acertar um mob.
    abilityDescription_defense: Fornece temporariamente ao usuário efeitos de resistência e lentidão. Ativado ao clicar com o botão direito com a mão vazia e acertar um mob.
    abilityDescription_axeMastery: faz com que os machados causem danos temporariamente a todos os mobs em um determinado raio. Ativado ao clicar com o botão direito do mouse em um machado e acertar uma multidão.
