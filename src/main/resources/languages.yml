    abilityDescription: Skill Beschreibung
    abilityDescription_digging: Fügt deiner Schaufel vorübergehend 5 Effizienzlevel
      hinzu. Aktivierung durch Rechts-Klick auf eine Schaufel und anschließend einen
      Block abbauen.
    abilityDescription_woodcutting: Lässt vorübergehend Äxte einen ganzen Baum mit
      einem Block fällen. Aktivierung durch Rechts-Klick auf eine Axt und anschließend
      einen Stamm abbauen.
    abilityDescription_mining: Fügt deiner Spitzhacke vorübergehend 5 Effizienzlevel
      hinzu. Aktivierung durch Rechts-Klick auf einer Spitzhacke und anschließende
      einen Block abbaust.
    abilityDescription_farming: Vorübergehend werden mit einer Hacke geerntete Items
      automatisch neu gepflanzt. Wird aktiviert, indem du mit einer Hacke Rechts-Klick
      auf die Ernte machst.
    abilityDescription_fishing: Lässt vorübergehend Angelruten sofort einen Fisch
      fangen. Aktivierung durch Links-Klick auf eine Angelrute und anschließendes
      Angeln im Wasser.
    abilityDescription_beastMastery: Verleiht deinem Pferd vorübergehend einen Geschwindigkeitsschub.
      Aktivierung durch Rechts-Klick auf einem Pferd und anschließendes Klicken mit
      der linken Maustaste.
    abilityDescription_swordsmanship: Entfernt vorübergehend die schwingende Abklingzeit
      von Schwertern. Aktivierung durch Rechts-Klick auf ein Schwert und dann einen
      Mob schlagen.
    abilityDescription_defense: Gibt dem Spieler vorübergehend Widerstands- und Langsamkeitseffekte.
      Aktivierung durch Rechts-Klick mit einer leeren Hand und dann einen Mob schlagen.
    abilityDescription_axeMastery: Lässt Äxte vorübergehend alle Mobs in einem bestimmten
      Radius beschädigen. Aktivierung durch Rechts-Klick auf eine Axt klicken und
      dann einen Mob schlagen.
