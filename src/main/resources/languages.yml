    abilityDescription: Описание способности
    abilityDescription_digging: Временно увеличивает эффективность вашей лопаты на 5 уровней. Активируется щелчком правой кнопкой мыши по лопате, затем разрушением блока.
    abilityDescription_woodcutting: Временно заставляет топоры ломать все дерево разрушением одного блока. Активируется щелчком правой кнопкой мыши по топору, затем разрушением бревна.
    abilityDescription_mining: Временно увеличивает эффективность вашей кирки на 5 уровней. Активируется щелчком правой кнопкой мыши по кирке, затем разрушением блока.
    abilityDescription_farming: Временно заставляет посевы, сломанные мотыгой, автоматически пересаживать. Активируется щелчком правой кнопкой мыши по мотыге, затем разрушением посева.
    abilityDescription_fishing: Временно заставляет удочки мгновенно ловить рыбу. Активируется щелчком левой кнопки мыши удочкой по блоку, затем ловлей рыбы.
    abilityDescription_beastMastery: Временно увеличивает скорость вашей лошади. Активируется щелчком правой кнопкой мыши по лошади, а затем щелчком левой кнопкой мыши.
    abilityDescription_swordsmanship: Временно убирает перезарядку атаки на мечах. Активируется щелчком правой кнопки мыши по мечу, затем ударом мечом по мобу.
    abilityDescription_defense: Временно дает пользователю эффекты сопротивления к урону и замедления. Активируется щелчком правой кнопкой мыши пустой рукой, затем ударом по мобу.
    abilityDescription_axeMastery: Временно заставляет топоры наносить урон всем мобам в определенном радиусе.Активируется щелчком правой кнопкой мыши по топору, затем ударом по мобу.
