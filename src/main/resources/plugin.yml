name: FreeRPG
version: ${project.version}
main: mc.carlton.freerpg.FreeRPG
api-version: '26.3'
authors: [ JackCarlton, AdvancedWipe, PieterGeschiere ]
description: RPG skill system for Minecraft 26.3 (fork of FreeRPG by Jack Carlton and AdvancedWipe)
website: https://github.com/PieterGeschiere/Minecraft_FreeRPG
softdepend: [ WorldGuard,PlaceholderAPI ]
commands:
  frpg:
    description: Main FreeRPG command, type /frpg help for more info
    aliases: [ rpgFree ]
  spite:
    description: Tells you what spite is good for.
  digging:
    description: Opens the skill tree of digging (same as /frpg skillTree digging)
    usage: /digging
  woodcutting:
    description: Opens the skill tree of woodcutting (same as /frpg skillTree woodcutting)
    usage: /woodcutting
  mining:
    description: Opens the skill tree of mining (same as /frpg skillTree mining)
    usage: /mining
  farming:
    description: Opens the skill tree of farming (same as /frpg skillTree farming)
    usage: /farming
  fishing:
    description: Opens the skill tree of fishing (same as /frpg skillTree fishing)
    usage: /fishing
  beastmastery:
    description: Opens the skill tree of beastMastery (same as /frpg skillTree beastMastery)
    usage: /beastmastery
  swordsmanship:
    description: Opens the skill tree of swordsmanship (same as /frpg skillTree swordsmanship)
    usage: /swordsmanship
  defense:
    description: Opens the skill tree of defense (same as /frpg skillTree defense)
    usage: /defense
  axemastery:
    description: Opens the skill tree of axeMastery (same as /frpg skillTree axeMastery)
    usage: /axemastery
  repair:
    description: Opens the skill tree of repair (same as /frpg skillTree repair)
    usage: /repair
  agility:
    description: Opens the skill tree of agility (same as /frpg skillTree agility)
    usage: /agility
  alchemy:
    description: Opens the skill tree of alchemy (same as /frpg skillTree alchemy)
    usage: /alchemy
  smelting:
    description: Opens the skill tree of smelting (same as /frpg skillTree smelting)
    usage: /smelting
  enchanting:
    description: Opens the skill tree of enchanting (same as /frpg skillTree enchanting)
    usage: /enchanting
  macemastery:
    description: Opens the skill tree of maceMastery (same as /frpg weapons, then the skill)
    usage: /macemastery
    aliases: [ mace ]
  tridentmastery:
    description: Opens the skill tree of tridentMastery (same as /frpg weapons, then the skill)
    usage: /tridentmastery
    aliases: [ trident ]
  spearmastery:
    description: Opens the skill tree of spearMastery (same as /frpg weapons, then the skill)
    usage: /spearmastery
    aliases: [ spear ]
  bowmastery:
    description: Opens the skill tree of bowMastery (same as /frpg weapons, then the skill)
    usage: /bowmastery
    aliases: [ bow ]
  crossbowmastery:
    description: Opens the skill tree of crossbowMastery (same as /frpg weapons, then the skill)
    usage: /crossbowmastery
    aliases: [ crossbow ]
permissions:
  freeRPG.*:
    description: Gives access to all FreeRPG commands
    default: op
    children:
      freeRPG.standardPlayer: true
      freeRPG.GUI: true
      freeRPG.changeStats: true
      freeRPG.getEXP: true
      freeRPG.useAbilities: true
  freeRPG.standardPlayer:
    description: Grants the player all recommended permissions (for a common player)
    default: true
    children:
      freeRPG.GUI: true
      freeRPG.getEXP: true
      freeRPG.getSouls: true
      freeRPG.useAbilities: true
      freeRPG.canRepair: true
      freeRPG.canSalvage: true
      freeRPG.fish: true
      freeRPG.info: true
      freeRPG.help: true
      freeRPG.leaderboard: true
      freeRPG.toggles: true
  freeRPG.GUI:
    description: Gives access to all GUI commands
    default: true
    children:
      freeRPG.mainGUI: true
      freeRPG.configGUI: true
      freeRPG.craftGUI: true
      freeRPG.confirmGUI: true
      freeRPG.skillsGUI: true
      freeRPG.skillConfigGUI: true
  freeRPG.toggles:
    description: gives access to all toggle commands
    default: true
    children:
      freeRPG.toggleFlint: true
      freeRPG.toggleSpeed: true
      freeRPG.togglePotion: true
      freeRPG.toggleFlamePick: true
      freeRPG.toggleGrapple: true
      freeRPG.toggleHotRod: true
      freeRPG.toggleVeinMiner: true
      freeRPG.toggleMegaDig: true
      freeRPG.toggleLeafBlower: true
  freeRPG.changeStats:
    description: Gives access to all stat changing commands
    default: op
    children:
      freeRPG.giveEXP: true
      freeRPG.setLevel: true
      freeRPG.statReset: true
      freeRPG.setSouls: true
      freeRPG.setTokens: true
      freeRPG.saveStats: true
      freeRPG.setMultiplier: true
      freeRPG.resetCooldown: true
  freeRPG.getEXP:
    description: Allows player to gain every type of EXP
    default: true
    children:
      freeRPG.diggingEXP: true
      freeRPG.woodcuttingEXP: true
      freeRPG.miningEXP: true
      freeRPG.farmingEXP: true
      freeRPG.fishingEXP: true
      freeRPG.archeryEXP: true
      freeRPG.beastMasteryEXP: true
      freeRPG.swordsmanshipEXP: true
      freeRPG.defenseEXP: true
      freeRPG.axeMasteryEXP: true
      freeRPG.maceMasteryEXP: true
      freeRPG.tridentMasteryEXP: true
      freeRPG.spearMasteryEXP: true
      freeRPG.bowMasteryEXP: true
      freeRPG.crossbowMasteryEXP: true
      freeRPG.repairEXP: true
      freeRPG.agilityEXP: true
      freeRPG.alchemyEXP: true
      freeRPG.smeltingEXP: true
      freeRPG.enchantingEXP: true
  freeRPG.useAbilities:
    description: allows the player to use all skill abilities
    default: true
    children:
      freeRPG.diggingAbility: true
      freeRPG.woodcuttingAbility: true
      freeRPG.miningAbility: true
      freeRPG.farmingAbility: true
      freeRPG.fishingAbility: true
      freeRPG.archeryAbility: true
      freeRPG.beastMasteryAbility: true
      freeRPG.swordsmanshipAbility: true
      freeRPG.defenseAbility: true
      freeRPG.axeMasteryAbility: true
      freeRPG.maceMasteryAbility: true
      freeRPG.tridentMasteryAbility: true
      freeRPG.spearMasteryAbility: true
      freeRPG.bowMasteryAbility: true
      freeRPG.crossbowMasteryAbility: true
  freeRPG.maceMasteryEXP:
    description: Allows player to get maceMastery experience
    default: true
  freeRPG.maceMasteryAbility:
    description: allows the player to use the maceMastery ability
    default: true
  freeRPG.tridentMasteryEXP:
    description: Allows player to get tridentMastery experience
    default: true
  freeRPG.tridentMasteryAbility:
    description: allows the player to use the tridentMastery ability
    default: true
  freeRPG.spearMasteryEXP:
    description: Allows player to get spearMastery experience
    default: true
  freeRPG.spearMasteryAbility:
    description: allows the player to use the spearMastery ability
    default: true
  freeRPG.bowMasteryEXP:
    description: Allows player to get bowMastery experience
    default: true
  freeRPG.bowMasteryAbility:
    description: allows the player to use the bowMastery ability
    default: true
  freeRPG.crossbowMasteryEXP:
    description: Allows player to get crossbowMastery experience
    default: true
  freeRPG.crossbowMasteryAbility:
    description: allows the player to use the crossbowMastery ability
    default: true
  freeRPG.reloadWeapons:
    description: allows user to reload weaponSkills.yml (/frpg reloadWeapons)
    default: op
  freeRPG.weaponSkills:
    description: allows user to open the weapon skills menu (/frpg weapons)
    default: true
  freeRPG.mainGUI:
    description: allows user to access main GUI with all skills
    default: true
  freeRPG.skillsGUI:
    description: allows user to access a skill's GUI (skill tree)
    default: true
  freeRPG.configGUI:
    description: allows user to access the configuration GUI
    default: true
  freeRPG.craftGUI:
    description: allows user to access the GUI that shows crafting recipes
    default: true
  freeRPG.confirmGUI:
    description: allows user to access the cofirmation GUI when refunding skills
    default: true
  freeRPG.info:
    decription: Allows the user to access the link to the info google document
    default: true
  freeRPG.help:
    description: Allows the user to see all FreeRPG commands
    default: true
  freeRPG.leaderboard:
    description: Allows the user to access the leaderboard command, showing the user the top players in each skill
    default: true
  freeRPG.enchantItem:
    descriptin: Allows the user to access the enchant item command
    default: op
  freeRPG.giveEXP:
    decription: Allows the user to give FreeRPG experience to any other player, including themselves
    default: op
  freeRPG.setLevel:
    description: Allows the user to set the FreeRPG skill level of any skill for any player
    default: op
  freeRPG.statReset:
    description: Allows the user to reset any FreeRPG skill of any player
    default: op
  freeRPG.setMultiplier:
    description: Allows the user to set any player's personal EXP multiplier
    default: op
  freeRPG.diggingEXP:
